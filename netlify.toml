# Netlify builds the site (client/) only; the API runs on Render from
# server/Dockerfile (render.yaml). Setup, secrets and DNS: docs/deploy.md.
#
# Free plan: each production deploy costs 15 of 300 monthly credits, and
# when credits run out every site on the account pauses until next month.
# So production deploys come only from main (set in the Netlify UI, with
# branch deploys off), and a push that changes nothing under client/
# doesn't build at all (Netlify's default for a base directory). That
# includes a change to this file alone: after merging one, start a deploy in
# the Netlify UI (Deploys > Trigger deploy). Deploy Previews cost no
# credits and stay private: each pull request gets one, built like
# production.

[build]
  base = "client"
  command = "npm run build"
  # Relative to base. Without it Netlify published client/ itself as plain
  # files, and no page was server-rendered.
  publish = ".next"

# Netlify's Next.js adapter (OpenNext): server rendering, revalidation, image
# optimisation. Netlify adds it by itself only when it detects Next.js while
# linking the repository, which it can't here (no package.json at the root).
# Not pinned in package.json, so each build uses the latest release, as
# Netlify recommends.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Public values only: they are built into the pages, and the build fails
# without them, so every context (production and Deploy Previews) gets them.
# Secrets go in the Netlify UI, and so does the launch switch, SITE_INDEXING,
# set for the production context only.
[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_URL = "https://api.biniyam.com/api"
  NEXT_PUBLIC_SITE_URL = "https://www.biniyam.com"
