# Checks every pull request and every push to main.
#
# client: clean install, lint, type-check, unit tests and a production build.
# server: clean install, type-check and unit tests.
# e2e: Playwright browser tests (desktop and phone Chromium) against a
#      production build of the client and a fixture mock API.
#
# Unit tests use Node's built-in runner (`npm test` in each package): the
# client's run on Node's native TypeScript stripping, the server's through
# tsx. They cover pure modules only, so they need no services or secrets.
#
# No secrets are used. The client build gets placeholder public values that
# point nowhere: build-time data fetches (projects API, Shopify) fail soft and
# render their empty states, so CI checks the code without depending on any
# live service. Actions are pinned to commit SHAs (version in the comment).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ci-placeholder.myshopify.com
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # Before the build: tests take about a second and fail faster.
      - name: Unit tests
        run: npm test

      # Next.js reuses compiled output between builds from .next/cache.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-${{ hashFiles('client/src/**', 'client/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-

      - name: Build
        run: npm run build

  server:
    name: Server (types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (Playwright, desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    # playwright.config.ts starts the mock API (client/e2e/mock-api), then
    # builds and starts the client against it, so no secrets or live
    # services are needed. Its public values are set in that config.
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Headless Chromium only (no headed browser, Firefox or WebKit), with
      # its system libraries.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Own key: this build bakes in different public values from the client job's.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/.next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-${{ hashFiles('client/src/**', 'client/next.config.ts') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-

      - name: E2E tests
        run: npm run test:e2e

      # HTML report with failure screenshots, traces from retried tests and
      # the full-page screenshots of each public page.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14
