# Checks every pull request and every push to main.
#
# client: clean install, lint, type-check, unit tests and a production build.
# server: clean install, type-check and unit tests.
#
# Unit tests use Node's built-in runner (`npm test` in each package): the
# client's run on Node's native TypeScript stripping, the server's through
# tsx. They cover pure modules only, so they need no services or secrets.
#
# No secrets are used. The client build gets placeholder public values that
# point nowhere: build-time data fetches (projects API, Shopify) fail soft and
# render their empty states, so CI checks the code without depending on any
# live service. Actions are pinned to commit SHAs (version in the comment).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ci-placeholder.myshopify.com
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # Before the build: tests take about a second and fail faster.
      - name: Unit tests
        run: npm test

      # Next.js reuses compiled output between builds from .next/cache.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-${{ hashFiles('client/src/**', 'client/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-

      - name: Build
        run: npm run build

  server:
    name: Server (types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
